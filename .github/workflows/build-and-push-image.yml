name: Build and Push Image to GHCR

# Forked from hargata/lubelog_mcp to add read tools (GetOdometerRecords,
# GetReminders) for mileage/service projections. Upstream's own workflow
# pushes to hargata's DockerHub/GHCR accounts using secrets this fork does
# not have, so this publishes only to this fork's own GHCR namespace, using
# the repo's built-in GITHUB_TOKEN (no extra secrets to configure).

on:
  push:
    branches: ["main"]
  release:
    types: ["published"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      # A build of any branch other than the default (run by hand) is tagged with the branch name,
      # so a test branch can be deployed without touching :latest.
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: workflow
          images: |
            ghcr.io/barrow1990/lubelogger_mcp
          tags: |
            type=edge,branch=main
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
